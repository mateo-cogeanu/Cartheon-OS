# game.cfg must be in the root of an exFAT cartridge.
version = 1

[game]
title = "My Windows Game"
executable = "Game/MyGame.exe"
runtime = "wine"
working_directory = "Game"
arguments = ["-fullscreen"]
gamemode = true

[game.environment]
DXVK_LOG_LEVEL = "none"

[display]
boot_animation_seconds = 4.0

[wine]
# "local" stores saves/prefix state on the installed OS.
# "cartridge" stores .cartheon/wineprefix on the exFAT drive.
prefix = "local"
debug = false
esync = true
fsync = true
ntsync = true
