name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Unit and compile checks
        run: |
          make test
          make lint
      - name: Shell checks
        run: shellcheck auto/* scripts/*.sh packaging/cartheon/DEBIAN/postinst packaging/cartheon/rootfs/usr/bin/* packaging/cartheon/rootfs/usr/lib/cartheon/cartheon-installer config/hooks/live/*.hook.chroot
      - name: Build shell package
        run: |
          make app-deb
          dpkg-deb --info config/packages.chroot/cartheon-shell_0.1.0_all.deb
