[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartheon"
version = "0.1.0"
description = "The cartridge shell and launcher for Cartheon OS"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = []

[project.scripts]
cartheon-shell = "cartheon.main:main"
cartheon-validate = "cartheon.validate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
